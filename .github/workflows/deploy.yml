name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Repo secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, DEPLOY_SSH_KEY,
# DEPLOY_KNOWN_HOSTS, APP_URL. The server needs no GitHub access — the runner
# pushes sources over SSH and rebuilds the container in place.
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-glu27
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync sources
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEST: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude '.svelte-kit' \
            --exclude 'build' --exclude '.env' --exclude '.env.*' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ "$USER@$HOST:$DEST/"

      - name: Build and restart
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEST: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "cd '$DEST' && docker compose up -d --build --remove-orphans \
             && docker image prune -f >/dev/null"

      - name: Health check
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/" || true)
            if [ "$code" = "200" ]; then echo "healthy: $APP_URL"; exit 0; fi
            sleep 4
          done
          echo "health check failed (last status: $code)"; exit 1
